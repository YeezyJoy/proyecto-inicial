<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maqueta Django - Transformación Digital</title>
    <!-- Solo cargamos Bootstrap 5 nativo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <!-- Tarjeta de Login -->
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                        
                        <!-- Formulario Básico -->
                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="usuario@empresa.com">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="Tu contraseña">
                            </div>
                            <!-- En Django aquí iría un {% csrf_token %} -->
                            <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
