<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maqueta Django - Transformación Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="row justify-content-center align-items-center min-vh-100 mb-5">
        <div class="col-md-5">
            <div class="card shadow-sm border-success">
                <div class="card-body">
                    <h2 class="text-center mb-4">Registro de Usuario</h2>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger py-2">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form action="" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" name="reg_username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" name="reg_email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" name="reg_password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Crear cuenta</button>
                    </form>

                    <div class="text-center border-top pt-3 mt-3">
                        <p class="mb-2">¿Ya tienes cuenta?</p>
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">Inicia sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
