<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Transforma Tu Pyme{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .sidebar { width: 230px; min-height: 100vh; background: #fff; border-right: 1px solid #e5e7eb; }
        .sidebar .nav-link { color: #374151; border-radius: .5rem; padding: .6rem .9rem; }
        .sidebar .nav-link:hover { background: #f3f4f6; }
        .sidebar .nav-link.active { background: #dbeafe; color: #1d4ed8; font-weight: 600; }
        .nivel-segmento { height: 14px; flex: 1; border-radius: 3px; background: #d1d5db; }
        .nivel-segmento.on { background: #2563eb; }
        .punto { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>
<div class="d-flex">
    <aside class="sidebar p-3 d-none d-md-flex flex-column">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
            <i class="bi bi-shop fs-3 text-primary"></i>
            <strong class="lh-sm">Transforma<br>Tu Pyme</strong>
        </div>
        <nav class="nav flex-column gap-1">
            <a class="nav-link {% if activo == 'inicio' %}active{% endif %}" href="{% url 'home' %}"><i class="bi bi-house-door me-2"></i>Inicio</a>
            <a class="nav-link {% if activo == 'diagnostico' %}active{% endif %}" href="{% url 'diagnostico' %}"><i class="bi bi-file-earmark-text me-2"></i>Diagnóstico</a>
            <a class="nav-link {% if activo == 'plan' %}active{% endif %}" href="{% url 'plan' %}"><i class="bi bi-list-check me-2"></i>Plan de acción</a>
            <a class="nav-link {% if activo == 'progreso' %}active{% endif %}" href="{% url 'seguimiento' %}"><i class="bi bi-bar-chart me-2"></i>Mi progreso</a>
            <a class="nav-link" href="#"><i class="bi bi-gear me-2"></i>Configuración</a>
        </nav>
        <div class="mt-auto border-top pt-3 small">
            <div class="text-muted mb-2"><i class="bi bi-person-circle me-1"></i>{{ user.username }}</div>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm w-100">Cerrar sesión</a>
        </div>
    </aside>

    <main class="flex-grow-1 p-4">
        <div class="container-lg" style="max-width: 900px;">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>
</div>
</body>
</html>
