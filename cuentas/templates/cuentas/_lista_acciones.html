<div class="list-group shadow-sm">
    {% for a in acciones %}
    <a href="{% url 'accion' a.id %}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
        <span class="fw-semibold text-muted">{{ forloop.counter }}.</span>
        <span class="badge bg-{{ a.color_prioridad }}-subtle text-{{ a.color_prioridad }}-emphasis" style="min-width: 56px;">{{ a.get_prioridad_display }}</span>
        <div class="flex-grow-1">
            <div class="fw-semibold">{{ a.titulo }}</div>
            <small class="text-muted">{{ a.get_area_display }}</small>
        </div>
        <span class="badge bg-{{ a.color_estado }}-subtle text-{{ a.color_estado }}-emphasis">{{ a.get_estado_display }}</span>
        <i class="bi bi-chevron-right text-muted"></i>
    </a>
    {% endfor %}
</div>
